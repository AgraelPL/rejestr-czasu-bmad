[[entry]]
id = 3
type = "story"
title = "Zbiorcza weryfikacja na serwerze, próba oddzielenia danych i odtworzenie z Kopii serwera"
description = "Na serwerze z historii 1 Autor przechodzi listę sprawdzeń, które epiki 1–3 i 5 wykonały lokalnie: belka i menu zależne od roli z Wyloguj, ikona ? i komunikat o zerwanym połączeniu (1.3), Projekty i Typy pracy z regułami R1–R3 na dwóch Kontach (1.7, 1.8), Sesja wpisywania i Lista wpisów, Widok miesiąca z sumami równymi pobranemu Zestawieniu, ekran Użytkownicy. Próba SM-5 na Kontach Autora i znajomego. Ćwiczenie odtworzenia z Kopii serwera na tymczasowym serwerze bez ruszania produkcji i strona docs/admin/ o odtwarzaniu (przeniesione z epiku 5). Lista sprawdzeń trafia do docs/admin/, żeby dało się ją powtórzyć po większej zmianie. Błąd funkcji znaleziony tutaj to nowa historia w epiku właściciela."
verify = "Na https://czas-pracy.kandula-consulting.pl każda pozycja listy sprawdzeń z docs/admin/ przechodzi, z wynikiem zapisanym w planie tej historii; Autor i znajomy z własnymi Projektami, Typami pracy i Wpisami nie widzą swoich danych w Liście wpisów, Widoku miesiąca ani Zestawieniu, a ten sam kod Projektu u obu nie koliduje; tymczasowy Droplet z Kopii serwera uruchamia aplikację z danymi z chwili kopii według docs/admin/ i zostaje usunięty, a produkcja przez cały czas odpowiada na /health 200; na serwerze nie ma prawdziwych danych wrześniowych."
covers = ["R24", "R27"]
after = [2]
hitl = true # Autor przechodzi sprawdzenia na serwerze, zakłada Konto znajomego i tymczasowy Droplet z Kopii serwera
risk = "medium" # pierwsze odtworzenie z Kopii serwera; sprawdzenia funkcji powtarzają te z epików
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-2", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-19", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-21"]
