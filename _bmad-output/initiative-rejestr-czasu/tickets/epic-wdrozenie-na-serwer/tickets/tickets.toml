description = "Ten sam krok wdrożenia z deploy.yml z historii 1 uruchamiany ręcznie (workflow_dispatch) z tagiem wcześniejszego obrazu, z plikami deploy/ z commita tego tagu; strona docs/admin/ o rollbacku i jego ograniczeniu (migracje tylko dodające). Ćwiczenie na serwerze."
