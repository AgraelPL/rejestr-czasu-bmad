# Historie epiku Widok miesiąca i Zestawienie, w kolejności budowy.
next_id = 10

[[entry]]
id = 1
type = "story"
title = "Widok miesiąca z sumami i Wierszami zestawienia z MonthReport"
description = "Tracer bullet. Reporting/MonthEntriesQuery.LoadAsync(YearMonth) w kontekście Usera i czysty MonthReport.Build, w całości z typami wejścia i wyjścia (AD-5): sumy dnia, tygodnia (poniedziałek–niedziela, tylko dni Miesiąca) i Miesiąca, kolejność Wpisów (dzień, kod Projektu, nazwa Typu pracy, kolejność dodania) oraz Wiersze zestawienia (Wpisy z tego samego dnia, Projektu i Typu pracy w jeden wiersz, Czas sumowany, opisy w kolejnych liniach w kolejności dodania, Suma tygodnia przy pierwszym wierszu tygodnia), z których korzysta pisarz Zestawienia w historii 3. Testy xUnit na zanonimizowanym zestawie o kształcie września 2026 (tygodnie 30 / 16 / 18 / 25 / 14 h, RAZEM 103 h). Ekran /miesiac (bieżący Miesiąc) na EodPage + EodReport: LockedLayout z grupowaniem Tydzień → Dzień, nagłówek tygodnia „Tydzień N (dd.mm–dd.mm)” z zakresem tylko z Miesiąca, dzień z nazwą dnia tygodnia, GroupSummary i FooterSummary z MonthReport, filtr kolumn bez wpływu na sumy, ShowExport=false, bez paginacji. Strona pomocy `miesiac`."
verify = "Lokalnie: /miesiac pokazuje Wpisy bieżącego Miesiąca w grupach Tydzień → Dzień z Sumą tygodnia, Sumą dnia i sumą Miesiąca; filtr kolumny ukrywa wiersze, sumy zostają; testy xUnit MonthReport na zestawie o kształcie września (sumy 30 / 16 / 18 / 25 / 14, RAZEM 103, złączanie opisów, kolejność, tydzień na przełomie Miesięcy) i bUnit ekranu zielone."
covers = ["R1", "R2", "R3", "R6", "R8"]
after = ["7.1", "7.3", "epic-szkielet-i-slowniki"]
hitl = false
risk = "high" # rdzeń sum dla Widoku i Zestawienia
references = ["export-layout.md", "glossary.md", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-5", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-9", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-22"]

[[entry]]
id = 3
type = "story"
title = "Zestawienie xlsx z Widoku miesiąca"
description = "Endpoint GET /zestawienie/{rok}/{miesiac} (RequireAuthorization, dane z MonthEntriesQuery w kontekście Usera, AD-14) i pisarz xlsx (ClosedXML) w układzie z export-layout.md: arkusz z nazwą Miesiąca, zamrożony nagłówek, kolumny A–H, Sumy dnia i tygodnia oraz wiersz RAZEM jako wartości. Pisarz bierze Wiersze zestawienia i sumy z MonthReport z historii 1. Przycisk „Pobierz Zestawienie” w Widoku miesiąca przez Shared/DownloadLink (atrybut download); Miesiąc bez Wpisów daje komunikat zamiast pliku; nazwa pliku Zestawienie-<miesiąc małą literą>_<RRRR>.xlsx (prefiks w historii 5). Usunięcie pozycji menu „Eksport” (menu, test układu, pomoc startowa) i zapisów o ekranie Eksport w AD-11, AD-14, AD-22 i PRD §4.5. Pomoc `miesiac` opisuje przycisk."
verify = "Lokalnie: przycisk w Widoku miesiąca pobiera Zestawienie-wrzesień_2026.xlsx, który otwiera się w Excelu w układzie z export-layout.md z sumami równymi sumom Widoku; pusty Miesiąc daje komunikat; testy pisarza (odczyt skoroszytu: komórki, sumy jako wartości, układ) i endpointu (cudze Wpisy niewidoczne; bez logowania i z nieaktywnym Kontem przekierowanie na logowanie) zielone; w menu nie ma Eksportu."
covers = ["R2", "R4", "R5", "R8"]
after = [1]
hitl = false
risk = "high" # najmniej pewna: układ Odbiorcy co do komórki
references = ["export-layout.md", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-14", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-11", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-22", "prd-rejestr-czasu/prd-rejestr-czasu.md"]

[[entry]]
id = 4
type = "story"
title = "Wybór Miesiąca i akcje Wpisu w Widoku miesiąca"
description = "Przyciski Poprzedni / Następny / Bieżący i Miesiąc w adresie /miesiac/RRRR-MM (bez niego bieżący; zły adres → strona „nie znaleziono”). Ikony w wierszu Edytuj / Kopiuj / Usuń przez EntryDialogs po Id; po zmianie lista i sumy liczone od nowa z bazy. Pasek komunikatu dopiero po ponownym wczytaniu listy (EntryDialogs, także Lista wpisów i Nowy wpis). Pomoc `miesiac` uzupełniona."
verify = "Lokalnie: przejście do poprzedniego Miesiąca zmienia adres i dane, zakładka z adresem otwiera ten Miesiąc; edycja, kopia i usunięcie Wpisu przeliczają Sumę dnia, tygodnia i Miesiąca od razu; pasek pojawia się po odświeżeniu listy; testy bUnit zielone."
covers = ["R1", "R8"]
after = [1, "7.5", "epic-wpisy-i-lista"]
hitl = false
risk = "medium"
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-10"]

[[entry]]
id = 5
type = "story"
title = "Ustawienia konta z prefiksem pliku Zestawienia"
description = "Ekran /ustawienia-konta (link w belce już jest) na EodPage: prefiks pliku Zestawienia z walidatorem (spacje na końcach pomijane, najwyżej 100 znaków, bez \\ / : * ? \" < > |, puste usuwa prefiks), zapis do account_settings tworzonego leniwie przy pierwszym zapisie (AD-7), link do /konto/zmiana-hasla (AD-15). Endpoint Zestawienia czyta prefiks: <prefiks>_Zestawienie-<miesiąc>_<RRRR>.xlsx. Strona pomocy `ustawienia-konta`."
verify = "Lokalnie: zapis prefiksu „ABC” daje plik ABC_Zestawienie-wrzesień_2026.xlsx, wyczyszczenie prefiksu wraca do nazwy bez prefiksu, niedozwolony znak pokazuje komunikat pod polem; link prowadzi do zmiany hasła; testy walidatora, zapisu (wiersz tworzony przy pierwszym zapisie, oddzielenie danych) i nazwy pliku zielone."
covers = ["R5", "R7", "R8"]
after = [3, "4.4"]
hitl = false
risk = "low"
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-7", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-8", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-15"]

