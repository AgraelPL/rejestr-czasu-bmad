# Historie epiku Przejęcie wzorca UI eod-ui, w kolejności budowy.

[[entry]]
id = 1
type = "story"
title = "Kopia wzorca eod-ui w Rejestrze z dopasowaniem EodReport"
description = "Skopiowanie z eod-ui @ 8e66aea (klon do czytania C:\\Users\\kamil\\Documents\\eod-ui; eod-ui nie jest zmieniane) potrzebnych komponentów Eod.Platform.UI do src/RejestrCzasu/Ui/ (przestrzeń RejestrCzasu.Ui, nazwy i API jak we wzorcu) i zasobów (eod.css, eod.js, lokalne IMask i SortableJS) do wwwroot/ui/, bez części EOD i Syncfusion; migawka docs/UI_SPEC.md do docs/ui/UI_SPEC.md i docs/ui/DOPASOWANIA.md. Dopasowania EodReport z AD-23 poz. 1–5: ShowExport, ReportColumn.Format (sortowanie po surowej wartości), PreserveRowOrder, GroupSummary i FooterSummary zamiast Definition.Total, LockedLayout; każde jedną linią w DOPASOWANIA.md. Kopia kompiluje się z aplikacją; ekrany jeszcze z niej nie korzystają."
verify = "dotnet build bez ostrzeżeń; testy bUnit kopii EodReport: ukryty eksport, kolumna z Format sortowana liczbowo, zachowana kolejność wejścia, sumy grup i stopki od ekranu, zablokowany układ; DOPASOWANIA.md wymienia każdą zmianę względem wzorca; repozytorium eod-ui bez zmian."
covers = ["R17"]
after = []
hitl = false
risk = "medium" # kopia silnika raportu i jego dopasowania
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-23", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-1", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-9"]

[[entry]]
id = 2
type = "story"
title = "Dopasowanie komunikatów, szkieletu i EodHead w kopii wzorca"
description = "W kopii w Ui/ dopasowania z AD-23 poz. 6–10: UiMessages.ConfirmAsync bez skrótu przycisku głównego i z fokusem na drugim przycisku; nazwa aplikacji „Rejestr czasu” w EodShell i tytule karty; skrypt skali EodHead z pliku zamiast inline (CSP script-src 'self'); obejście błędu Fluent UI 5.0.1 w eod.js — combobox z wartością ustawioną przy pierwszym renderze pokazuje jej tekst (przeniesione z EntryForm.razor.js); usunięcie nieużywanych komponentów. Każde dopasowanie jedną linią w docs/ui/DOPASOWANIA.md."
verify = "dotnet build bez ostrzeżeń; testy bUnit: potwierdzenie nie reaguje na Enter, fokus na Anuluj; nazwa aplikacji w belce i tytule; EodHead bez inline skryptu; DOPASOWANIA.md kompletne."
covers = ["R16", "R26"]
after = [1]
hitl = false
risk = "medium"
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-23", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-11", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-12"]

[[entry]]
id = 3
type = "story"
title = "Szkielet aplikacji na EodShell z kopii wzorca"
description = "Tracer bullet. AddEodPlatformUI i UseEodPolishCulture z kopii zamiast AddFluentUIComponents i własnego lokalizatora, EodHead raz w App.razor. Shared/MainLayout renderuje EodShell: nazwa „Rejestr czasu”, przycisk Primary Nowy wpis, menu z NFR-6 (Administracja tylko dla Administratora), w belce ? (Shared/PageHelp przez SectionContent), Ustawienia konta, Wyloguj; granica błędów obejmuje FluentProviders (AD-17). UiMessages zastępuje Notify i Confirm we wszystkich ekranach (potwierdzenia bez skrótu Enter). Pomoc, spis pomocy i „nie znaleziono” na EodPage; komunikat zerwanego połączenia z klasami wzorca. EntryForm.razor.js usunięty (obejście w eod.js kopii). Dockerfile i CI bez zmian poza nowymi plikami w src/."
verify = "Lokalnie: dotnet run pokazuje szkielet EodShell z menu, ? otwiera temat ekranu, „nie znaleziono” na EodPage; usunięcie Projektu pyta w oknie, Enter nie potwierdza; CSP bez błędów w konsoli; edycja i kopia Wpisu pokazują Projekt i Typ pracy; workflow PR zielony; wszystkie testy (dopasowane do UiMessages) zielone."
covers = ["R17", "R19", "R26", "R31"]
after = [1, 2]
hitl = false
risk = "high" # wymiana szkieletu i komunikatów pod wszystkimi ekranami
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-1", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-11", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-22", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-6"]

