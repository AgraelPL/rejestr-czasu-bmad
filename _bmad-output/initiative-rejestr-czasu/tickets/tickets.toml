# Epiki inicjatywy Rejestr czasu pracy, w kolejności budowy.

[[epic]]
id = 4
slug = "epic-konta-i-wdrozenie"
title = "Konta i wdrożenie"
description = "Każda propozycja zmiany przechodzi build i testy, a merge do gałęzi głównej wdraża aplikację na serwer pod subdomeną z HTTPS; rollback jest przećwiczony. Przepisany schemat Initial ma UserId z globalnym filtrem i testami oddzielenia danych oraz dane Konta (stan, data rejestracji, ostatnie logowanie, licznik nieudanych prób); działa rejestracja (Konto Oczekuje), logowanie z blokadą po 5 próbach, wylogowanie, role User i Administrator, pierwszy Administrator z sekretu i sprawdzanie stanu Konta przy każdej akcji. Buduje na zrobionej historii 1.1 z epiku 1 (scaffold, docker compose, Testcontainers). Daje epikowi 1 UserId z filtrem, logowanie, role, autoryzację tras, układ dla niezalogowanych i potok wdrożenia; epikowi 5 stan Konta, jego dane i sprawdzanie stanu. R15 tu: konfiguracja i sekrety na serwerze i w potoku. R19 tu: logowanie, komunikaty o stanie, blokada po 5 próbach, wylogowanie. R24 tu: globalny filtr i testy automatyczne; próba na dwóch Kontach w epiku 5. R27 tu: strony docs/admin/ o serwerze, domenie, sekretach, SSH, dostępie do bazy, wdrożeniu i rollbacku."
covers = ["R15", "R18", "R19", "R20", "R24", "R27", "R28", "R29", "R30"]

[[epic]]
id = 1
slug = "epic-szkielet-i-slowniki"
title = "Szkielet aplikacji i Słowniki"
description = "Na serwerze każdy User prowadzi własne Projekty i Typy pracy na listach z filtrem wartości i licznikiem. Epik dostarcza kolejnym: Domain/Czas, PolishCalendar, YearMonth, DictionaryOptions, MainLayout z menu (Rejestr, Słowniki, Administracja tylko dla Administratora) i belką (Pomoc ?, Ustawienia konta, Wyloguj), mechanizm stron pomocy, komunikat o zerwanym połączeniu, Notify, Confirm i ReportGrid w pełnym zakresie AD-9. Link Ustawienia konta i pozycja Użytkownicy do czasu budowy ich ekranów (epiki 3 i 5) prowadzą do polskiej strony „nie znaleziono”. Kopia bazy przy starcie (historia 1.2) wypada. R2 tu: dezaktywacja na listach Słowników i DictionaryOptions. R15 tu: konfiguracja lokalna (historia 1.1, zrobiona). R17 tu: ReportGrid i listy Słowników. R19 tu: przycisk Wyloguj w belce. R26 tu: mechanizm /pomoc z ikoną ? i strony ekranów Słowników; każda późniejsza historia zmieniająca ekran dopisuje jego stronę."
covers = ["R1", "R2", "R3", "R15", "R17", "R19", "R26", "R31"]
after = [{ epic = 4, needs = "schemat Initial z UserId i globalnym filtrem, logowanie i wylogowanie, role User/Administrator, autoryzacja tras, układ dla niezalogowanych, wdrożenie na serwer" }]

[[epic]]
id = 2
slug = "epic-wpisy-i-lista"
title = "Wpisy w Sesji wpisywania i Lista wpisów"
description = "Na serwerze User przenosi notatki z kilku dni do własnych Wpisów samą klawiaturą, a na Liście wpisów wyszukuje, edytuje, kopiuje i usuwa Wpisy z sumą Czasu; data domyślna to dzisiejsza (Europe/Warsaw) przy każdym otwarciu ekranu Nowy wpis. Epik dostarcza dla epiku 3: EntryForm (strona /wpisy/nowy i okno dialogowe) oraz DeleteEntry z Confirm. R2 tu: nieaktywne pozycje znikają z list wyboru formularza i zostają przy edycji. R17 tu: filtr kolumn i licznik na Liście wpisów. R26 tu: strony pomocy ekranów Nowy wpis i Lista wpisów."
covers = ["R2", "R4", "R5", "R6", "R7", "R8", "R16", "R17", "R26"]
after = [{ epic = 1, needs = "Domain/Czas, PolishCalendar, YearMonth, DictionaryOptions, ReportGrid (pełny zakres AD-9), MainLayout, mechanizm pomocy, Notify i Confirm" }]

[[epic]]
id = 3
slug = "epic-miesiac-i-zestawienie"
title = "Widok miesiąca i Zestawienie"
description = "Na serwerze User sprawdza Miesiąc w siatce grupowanej Tydzień → Dzień i pobiera Zestawienie xlsx we wspólnym układzie (endpoint /zestawienie, ekran Eksport) z prefiksem nazwy z Ustawień konta; Test wrześniowy przechodzi lokalnie. Epik posiada MonthEntriesQuery i MonthReport.Build, jedyne źródło sum (AD-5), oraz ekran Ustawienia konta z prefiksem i zmianą własnego hasła. R17 tu: filtr kolumn i licznik w Widoku miesiąca; filtr nie zmienia sum z MonthReport. R26 tu: strony pomocy ekranów Widok miesiąca, Eksport i Ustawienia konta."
covers = ["R9", "R10", "R11", "R12", "R13", "R17", "R25", "R26"]
after = [
  { epic = 1, needs = "ReportGrid ze stałym grupowaniem, Domain/Czas, PolishCalendar, YearMonth, mechanizm pomocy, link Ustawienia konta w belce, Notify i Confirm" },
  { epic = 2, needs = "EntryForm w oknie dialogowym i DeleteEntry dla ikon w wierszach" },
]

[[epic]]
id = 5
slug = "epic-administracja-kont-i-pomoc"
title = "Administracja Kont i pomoc"
description = "Administrator na ekranie Użytkownicy zatwierdza, odrzuca, blokuje, odblokowuje i usuwa Konta (kaskada w jednej operacji) oraz ustawia hasło z wymuszoną zmianą przy pierwszym logowaniu; epik tylko zmienia stan Konta, a jego sprawdzanie przy każdej akcji daje epik 4. Próba oddzielenia danych (SM-5) na Koncie Autora i znajomego oraz ćwiczenie odtworzenia Kopii serwera na tymczasowym serwerze przechodzą przed Miesiącem „na serio”. Może iść równolegle z epikami 1–3; pozycja Użytkownicy w menu z epiku 1 zaczyna prowadzić do tego ekranu. R24 tu: próba na serwerze. R26 tu: strona pomocy o administracji oraz strony ekranów logowania, rejestracji i wymuszonej zmiany hasła. R27 tu: strona docs/admin/ o odtwarzaniu z Kopii serwera."
covers = ["R21", "R22", "R23", "R24", "R26", "R27"]
after = [{ epic = 4, needs = "Konta z danymi (stan, data rejestracji, ostatnie logowanie), role, logowanie i sprawdzanie stanu Konta przy każdej akcji" }]
