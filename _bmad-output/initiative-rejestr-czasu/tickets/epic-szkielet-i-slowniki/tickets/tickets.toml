title = "Projekty: lista, dodawanie, edycja, dezaktywacja i usuwanie"
description = "Ekran /projekty w ReportGrid z historii 5 i układzie z historii 3: dodawanie i edycja (kod i nazwa, walidator FluentValidation przez Blazilla, kod zapisywany wielkimi literami w SaveChanges; Wpisy odwołują się do Projektu tylko kluczem, więc zmiana widać we wszystkich Wpisach), duplikat kodu rozpoznawany przez tworzone tu Data/DbErrors i pokazywany w MessageBar, dezaktywacja i przywrócenie, usunięcie po Confirm tylko bez Wpisów, inaczej komunikat z liczbą Wpisów i propozycją dezaktywacji. Pierwszy ekran Słownika; historia 8 powtarza jego wzorzec i używa Data/DbErrors."
