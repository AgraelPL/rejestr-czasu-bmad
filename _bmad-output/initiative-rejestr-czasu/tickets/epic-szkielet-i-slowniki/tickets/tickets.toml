[[entry]]
id = 5
type = "story"
title = "ReportGrid: lista z filtrem, licznikiem i ikonami akcji"
description = "Shared/ReportGrid<T> jako nakładka na FluentDataGrid: przyjmuje IReadOnlyList<T>, zachowuje kolejność wejścia, nie liczy sum, ma filtr wartości w każdej kolumnie, licznik pozycji po filtrze i ikony akcji w wierszu (edycja, kopia, usunięcie) zadawane przez ekran. Daje listom Słowników i Liście wpisów jedną siatkę."
verify = "Testy bUnit pokazują, że filtr w kolumnie ukrywa wiersze i zmienia licznik, kolejność wierszy jest kolejnością wejścia, a kliknięcie ikony wywołuje akcję ekranu z danym wierszem."
covers = ["R17"]
