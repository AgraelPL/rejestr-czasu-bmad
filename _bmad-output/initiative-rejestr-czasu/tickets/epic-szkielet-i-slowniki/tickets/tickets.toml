# Historie epiku Szkielet aplikacji i Słowniki, w kolejności budowy.

[[entry]]
id = 1
type = "story"
title = "Szkielet aplikacji ze schematem Initial"
description = "Scaffold Blazor Web App (.NET 10, Interactive Server, Fluent UI 5 z zasobami lokalnymi i czcionką Segoe UI) z docker-compose.yml (postgres:18, 127.0.0.1:5432, wolumen, .env), AppDbContext ze wszystkimi encjami (Project, WorkType, TimeEntry), indeksami unikalności i FK RESTRICT w migracji Initial, startem: sprawdzenie bazy → Migrate() → serwer na 127.0.0.1 (krok Kopii bazy dokłada historia 2), kulturą pl-PL i rejestracją TimeProvider, szkieletem rejestracji usług w Program.cs (Fluent UI z IDialogService, IDbContextFactory, IOptions dla Database/Backup/Export), nagłówkiem CSP, appsettings.Local.json, .gitignore i README z krokami uruchomienia. Projekt testów: xUnit, bUnit z usługami Fluent UI oraz Testcontainers (wspólny kontener postgres:18, schemat przez Migrate(), czyszczenie danych między testami). Daje pozostałym historiom aplikację, schemat i infrastrukturę testów."
verify = "Po docker compose up -d i dotnet run strona startowa na http://127.0.0.1:<port> odpowiada z nagłówkiem Content-Security-Policy, a karta Sieć w DevTools pokazuje tylko żądania do 127.0.0.1; docker exec <container_name> psql -U <user> -c \"\\dt\" pokazuje tabele z migracji Initial; po docker compose stop dotnet run kończy się komunikatem „uruchom Docker Desktop i docker compose up -d”; dotnet test przechodzi, w tym jeden test bUnit i jeden na Testcontainers."
covers = ["R15"]
after = []
hitl = true # Autor instaluje Docker Desktop, tworzy .env i appsettings.Local.json według README, uruchamia docker compose up -d
risk = "medium"
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-1", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-2", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-3", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-6", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-7", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-12", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-13", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#consistency-conventions"]

[[entry]]
id = 2
type = "story"
title = "Kopia bazy przy starcie i odtwarzanie z README"
description = "Dokłada krok 2 startu z AD-3 między sprawdzenie bazy a Migrate() z historii 1: docker exec pg_dump do katalogu kopii z konfiguracji (rejestr-RRRR-MM-DD_GGMMSS.sql, zapis binarny), domyślny katalog kopii w appsettings.json poza repozytorium i poza folderami synchronizowanymi z chmurą, rotacja do 10 plików z usunięciem najstarszego dopiero po udanym zapisie, nieudana kopia zatrzymuje start z komunikatem; README z historii 1 dostaje sekcje odtwarzania przez psql i DOTNET_CLI_TELEMETRY_OPTOUT=1."
verify = "Każde dotnet run dodaje plik .sql w katalogu kopii, a przy 11. zostaje 10 najnowszych; przy błędnym container_name start kończy się komunikatem i bez migracji; Autor odtwarza bazę z Kopii bazy według README i widzi te same dane."
covers = ["R14", "R15"]
after = [1]
hitl = true # Autor wskazuje katalog kopii w appsettings.Local.json i raz wykonuje odtworzenie według README
risk = "high"
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-3", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-12", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-13"]

[[entry]]
id = 3
type = "story"
title = "Układ aplikacji z menu, Notify i Confirm"
description = "MainLayout z AD-11: belka górna, menu boczne (Nowy wpis; Rejestr: Widok miesiąca, Lista wpisów, Eksport; Administracja: Projekty, Typy pracy), nagłówek treści z tytułem, podtytułem, okruszkami i przyciskiem Odśwież, skala 90/100/110/125%, motyw jasny/ciemny, polskie teksty Fluent UI; Shared/Notify (FluentMessageBar) i Shared/Confirm (FluentMessageBox, fokus na Anuluj) oraz obsługa nieobsłużonego wyjątku ekranu przez Notify. Pozycje menu ekranów z epików 2 i 3 są aktywne od razu i do czasu budowy prowadzą do polskiej strony „nie znaleziono”. Daje Słownikom i epikom 2–3 układ i komunikaty."
verify = "Autor otwiera aplikację i widzi menu ze wszystkimi pozycjami, przełącza motyw, a zwężenie okna zmienia skalę; testy bUnit pokazują, że Confirm zwraca false po Anuluj i true po potwierdzeniu, a Notify wyświetla komunikat."
covers = []
after = [1]
hitl = false
risk = "low"
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-11"]

