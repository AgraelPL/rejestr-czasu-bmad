[[entry]]
id = 3
type = "story"
title = "Rejestracja, logowanie i wylogowanie"
description = "Używa schematu i UserDbContextFactory z historii 2. Statyczne strony /konto/logowanie, /konto/rejestracja, /konto/wyloguj (tylko POST z antyforgery) i /konto/brak-dostepu w Accounts/AccountLayout; App.razor wybiera tryb przez HttpContext.AcceptsInteractiveRouting(); passkeys z szablonu usunięte. Konfiguracja Identity z AD-15: login unikalny bez względu na wielkość liter, bez e-maila (IEmailSender bez wysyłki), hasło minimum 6 znaków bez klas, lockout 5 prób / 15 min z lockoutOnFailure: true, ciasteczko 14 dni z przedłużaniem, LoginPath i AccessDeniedPath. Accounts/CurrentUser z dwoma źródłami (AuthenticationStateProvider w obwodzie, HttpContext.User w żądaniu HTTP, UserId z NameIdentifier) zasila UserDbContextFactory. Rejestracja tworzy Konto pending z rolą User (bez wiersza account_settings, który powstaje leniwie w epiku 3, AD-7) oraz pokazuje zdanie o dostępie Administratora przez bazę. Logowanie najpierw sprawdza hasło, potem stan (CanSignInAsync), zapisuje last_login_at. Limit 10 POST/min/IP na rejestracji i logowaniu, polski IdentityErrorDescriber, polska odpowiedź limitera i polskie teksty Fluent UI przez IFluentLocalizer (AD-6). Jeden mechanizm autoryzacji: [Authorize] w _Imports.razor, RequireAuthorization() na endpointach, NotAuthorized w Routes. Link Pomoc w AccountLayout prowadzi do /pomoc/<temat>, a do historii 1.3 do polskiej strony „nie znaleziono”. Daje historii 4 strony i konfigurację Identity, historii 5 limiter prób (stawiany za UseForwardedHeaders), historii 1.3 IFluentLocalizer i POST /konto/wyloguj dla przycisku Wyloguj, a epikowi 1 CurrentUser."
verify = "Lokalnie: rejestracja tworzy Konto, a druga rejestracja tym samym loginem innymi wielkościami liter jest odrzucona; formularz rejestracji pokazuje zdanie o dostępie Administratora przez bazę; Konto Oczekuje i Konto z status=blocked nie logują się z komunikatem o stanie dopiero przy poprawnym haśle, a przy złym zawsze „Nieprawidłowy login lub hasło”; po ustawieniu status=active w bazie logowanie działa i zapisuje last_login_at; 5 złych haseł blokuje logowanie na 15 minut; POST na /konto/wyloguj kończy sesję, a GET nie wylogowuje; wejście na stronę aplikacji bez logowania przekierowuje na /konto/logowanie; testy na Testcontainers i bUnit pokrywają te ścieżki i limit prób; nagłówek CSP jest na stronach /konto."
covers = ["R18", "R19"]
after = [2]
hitl = false
risk = "medium" # szablon Identity trzeba przyciąć (passkeys, e-mail) i połączyć ze statycznym trybem stron
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-15", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-16", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-6", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-11", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-12"]

[[entry]]
id = 4
type = "story"
title = "Pierwszy Administrator, stan Konta w sesji i zmiana hasła"
description = "Używa stron i konfiguracji Identity z historii 3. Startup krok 3 z AD-21: gdy nie ma Administratora, powstaje Konto active z rolami Administrator i User (bez wiersza account_settings, AD-7) z FirstAdmin__UserName i FirstAdmin__Password; gdy jest, konfiguracja ignorowana; brak Administratora i brak konfiguracji kończy start czytelnym komunikatem. Stan Konta w sesji z AD-17: OnValidatePrincipal na każdym żądaniu HTTP (status, must_change_password, security stamp; jedyne kasowanie ciasteczka poza wylogowaniem), CurrentUser rzuca AccountInactiveException i PasswordChangeRequiredException, RevalidatingServerAuthenticationStateProvider co 1 minutę. Statyczna /konto/zmiana-hasla w dwóch trybach (wymuszona i dobrowolna z obecnym hasłem) kończona RefreshSignInAsync; middleware przekierowuje na nią przy must_change_password, z wyjątkami po metadanych endpointu. Daje historii 1.3 wyjątki stanu Konta do obsługi w MainLayout, historii 5 listę wyjątków przekierowania po metadanych endpointu, historii 8 pierwszego Administratora, epikowi 3 stronę zmiany hasła, a epikowi 5 mechanizm, który zmienia tylko stan i hasło."
verify = "Lokalnie: pusty schemat + dotnet run z FirstAdmin w appsettings.Local.json tworzy Konto Administratora z obiema rolami, drugi start nic nie zmienia, a start bez Administratora i bez FirstAdmin kończy się komunikatem; po ustawieniu status=blocked w bazie zalogowany User traci dostęp przy następnym żądaniu HTTP albo najpóźniej po minucie i trafia na logowanie, a wyjątki CurrentUser w obwodzie pokrywa test; po ustawieniu must_change_password każda strona prowadzi na /konto/zmiana-hasla, a zasoby statyczne nadal się ładują; dobrowolna zmiana hasła nie wylogowuje (User zalogowany po 2 minutach)."
covers = ["R19", "R20", "R25"]
after = [3]
hitl = false
risk = "high" # stan Konta w obwodzie Blazor Server i walidacja ciasteczka to najsłabiej udokumentowana część Identity
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-15", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-17", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-21", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-13"]
notes = ["Dodatkowe sprawdzenie: test, że zmiana security stamp innego Usera nie wylogowuje bieżącego."]

[[entry]]
id = 5
type = "story"
title = "Obraz aplikacji gotowy do pracy za proxy"
description = "Dockerfile z mcr.microsoft.com/dotnet/aspnet:10.0 (ICU i tzdata, ASPNETCORE_HTTP_PORTS=8080); aplikacja czyta tag obrazu ze zmiennej APP_IMAGE_TAG. UseForwardedHeaders (XForwardedFor, XForwardedProto) jako pierwszy element potoku, przed middleware CSP z historii 1.1 i limiterem z historii 3, z zaufaną podsiecią z klucza konfiguracji ForwardedHeaders__KnownNetwork w KnownIPNetworks. Klucze Data Protection w tabeli data_protection_keys z historii 2 (PersistKeysToDbContext, stały SetApplicationName). /health z AddDbContextCheck, [AllowAnonymous], zwraca tag obrazu, dodany do wyjątków przekierowania wymuszonej zmiany hasła z historii 4. Daje historii 8 obraz do wdrożenia oraz umowę: zmienne APP_IMAGE_TAG i ForwardedHeaders__KnownNetwork."
verify = "Lokalnie: docker build i docker run obrazu z bazą z docker compose daje stronę logowania na :8080; /health odpowiada 200 z tagiem obrazu; po restarcie kontenera zalogowany User nadal jest zalogowany; żądanie z nagłówkiem X-Forwarded-For z sieci zaufanej liczy limit prób dla adresu klienta, a z niezaufanej jest ignorowane; TimeZoneInfo Europe/Warsaw i kultura pl-PL działają w kontenerze."
covers = ["R15", "R29"]
after = [4]
hitl = false
risk = "medium" # kolejność potoku i zaufane proxy łatwo pomylić, ale wszystko sprawdzalne lokalnie
