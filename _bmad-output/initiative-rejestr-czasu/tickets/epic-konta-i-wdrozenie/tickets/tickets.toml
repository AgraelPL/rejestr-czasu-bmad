# Historie epiku Konta i wdrożenie, w kolejności budowy.

[[entry]]
id = 2
type = "story"
title = "Nowy schemat Initial z Identity i UserId"
description = "Usuwa migrację Initial z historii 1.1 i tworzy nową z całym schematem AD-7: tabele Identity z kluczami int i nazwami snake_case nadanymi jawnie, użytkownik z kolumnami status, registered_at, last_login_at, must_change_password, tabele account_settings i data_protection_keys, Project, WorkType i TimeEntry z user_id, indeksy (user_id, code) i (user_id, lower(name)), złożone klucze obce Wpisu ze Słownikami i klucze obce do users z RESTRICT. Wprowadza Data/IUserOwned, dwa tryby AppDbContext (Usera i systemowy) i Data/UserDbContextFactory przyjmującą UserId (źródło Usera, Accounts/CurrentUser, dokłada historia 3). Usuwa BackupOptions i ExportOptions oraz klucz Urls z appsettings.json (port lokalny w launchSettings.json). Daje historii 3 schemat i fabrykę kontekstu, historii 5 tabelę data_protection_keys, a epikom 1–3 i 5 oddzielenie danych."
verify = "Po docker compose down -v, docker compose up -d i dotnet run baza ma tabele z nowej Initial; testy na Testcontainers z fabryką ustawioną na dwa różne UserId pokazują, że Userzy nie widzą swoich Projektów, Typów pracy i Wpisów, Wpis z cudzym Projektem odrzuca baza, kontekst systemowy nie widzi i nie zapisuje encji IUserOwned, a każda encja z kolumną user_id implementuje IUserOwned."
covers = ["R24"]
after = []
hitl = false
risk = "high" # pierwsze użycie Identity z kluczami int i jawnymi nazwami snake_case; złożone klucze obce w EF Core
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-7", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-16", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-21", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-4"]
notes = ["Dodatkowe sprawdzenie: dotnet ef migrations script na nowej Initial przejrzany pod kątem nazw tabel Identity i kluczy złożonych."]

[[entry]]
id = 1
type = "story"
title = "CI na PR z kontrolą migracji i ochroną gałęzi main"
description = "Workflow .github/workflows/pr.yml uruchamiany na każdy PR do main: actions/setup-dotnet z global.json, dotnet build, dotnet test z Testcontainers na ubuntu-latest, dotnet ef migrations has-pending-model-changes i kontrola migracji dodających z AD-21 (pomija Initial; odrzuca usuwanie lub zmianę nazwy tabeli albo kolumny, zmianę typu, nowy indeks unikalny i migrationBuilder.Sql), DOTNET_CLI_TELEMETRY_OPTOUT=1, bez wypisywania sekretów. global.json przypięty na SDK 10.0.403. Pierwsza strona docs/admin/ opisuje ustawienie ochrony main (wymagane zielone sprawdzenia i aktualność gałęzi względem main). Daje historii 2 działający potok z kontrolą migracji, a historii 8 wzorzec workflow."
verify = "PR z celowo czerwonym testem i PR z testową migracją usuwającą kolumnę pokazują nieudane sprawdzenie i GitHub nie pozwala ich scalić; po wycofaniu obu zmian sprawdzenia są zielone i scalenie jest możliwe; log workflow nie zawiera haseł."
covers = ["R27", "R28"]
after = []
hitl = true # Autor włącza ochronę gałęzi main w ustawieniach repozytorium według docs/admin/
risk = "low" # standardowy workflow GitHub Actions; jedyna własna część to skrypt kontroli migracji
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-20", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-21", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-1"]

[[entry]]
id = 3
type = "story"
title = "Rejestracja, logowanie i wylogowanie"
description = "Używa schematu i UserDbContextFactory z historii 2. Statyczne strony /konto/logowanie, /konto/rejestracja, /konto/wyloguj (tylko POST z antyforgery) i /konto/brak-dostepu w Accounts/AccountLayout; App.razor wybiera tryb przez HttpContext.AcceptsInteractiveRouting(); passkeys z szablonu usunięte. Konfiguracja Identity z AD-15: login unikalny bez względu na wielkość liter, bez e-maila (IEmailSender bez wysyłki), hasło minimum 6 znaków bez klas, lockout 5 prób / 15 min z lockoutOnFailure: true, ciasteczko 14 dni z przedłużaniem, LoginPath i AccessDeniedPath. Accounts/CurrentUser z dwoma źródłami (AuthenticationStateProvider w obwodzie, HttpContext.User w żądaniu HTTP, UserId z NameIdentifier) zasila UserDbContextFactory. Rejestracja tworzy Konto pending z rolą User i wierszem account_settings oraz pokazuje zdanie o dostępie Administratora przez bazę. Logowanie najpierw sprawdza hasło, potem stan (CanSignInAsync), zapisuje last_login_at. Limit 10 POST/min/IP na rejestracji i logowaniu, polski IdentityErrorDescriber, polska odpowiedź limitera i polskie teksty Fluent UI przez IFluentLocalizer (AD-6). Jeden mechanizm autoryzacji: [Authorize] w _Imports.razor, RequireAuthorization() na endpointach, NotAuthorized w Routes. Link Pomoc w AccountLayout prowadzi do /pomoc/<temat>, a do historii 1.3 do polskiej strony „nie znaleziono”. Daje historii 4 strony i konfigurację Identity, historii 5 limiter prób (stawiany za UseForwardedHeaders), historii 1.3 IFluentLocalizer i POST /konto/wyloguj dla przycisku Wyloguj, a epikowi 1 CurrentUser."
verify = "Lokalnie: rejestracja tworzy Konto, a druga rejestracja tym samym loginem innymi wielkościami liter jest odrzucona; formularz rejestracji pokazuje zdanie o dostępie Administratora przez bazę; Konto Oczekuje i Konto z status=blocked nie logują się z komunikatem o stanie dopiero przy poprawnym haśle, a przy złym zawsze „Nieprawidłowy login lub hasło”; po ustawieniu status=active w bazie logowanie działa i zapisuje last_login_at; 5 złych haseł blokuje logowanie na 15 minut; POST na /konto/wyloguj kończy sesję, a GET nie wylogowuje; wejście na stronę aplikacji bez logowania przekierowuje na /konto/logowanie; testy na Testcontainers i bUnit pokrywają te ścieżki i limit prób; nagłówek CSP jest na stronach /konto."
covers = ["R18", "R19"]
after = [2]
hitl = false
risk = "medium" # szablon Identity trzeba przyciąć (passkeys, e-mail) i połączyć ze statycznym trybem stron
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-15", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-16", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-6", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-11", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-12"]

[[entry]]
id = 4
type = "story"
title = "Pierwszy Administrator, stan Konta w sesji i zmiana hasła"
description = "Używa stron i konfiguracji Identity z historii 3. Startup krok 3 z AD-21: gdy nie ma Administratora, powstaje Konto active z rolami Administrator i User i wierszem account_settings z FirstAdmin__UserName i FirstAdmin__Password; gdy jest, konfiguracja ignorowana; brak Administratora i brak konfiguracji kończy start czytelnym komunikatem. Stan Konta w sesji z AD-17: OnValidatePrincipal na każdym żądaniu HTTP (status, must_change_password, security stamp; jedyne kasowanie ciasteczka poza wylogowaniem), CurrentUser rzuca AccountInactiveException i PasswordChangeRequiredException, RevalidatingServerAuthenticationStateProvider co 1 minutę. Statyczna /konto/zmiana-hasla w dwóch trybach (wymuszona i dobrowolna z obecnym hasłem) kończona RefreshSignInAsync; middleware przekierowuje na nią przy must_change_password, z wyjątkami po metadanych endpointu. Daje historii 1.3 wyjątki stanu Konta do obsługi w MainLayout, historii 5 listę wyjątków przekierowania po metadanych endpointu, historii 8 pierwszego Administratora, epikowi 3 stronę zmiany hasła, a epikowi 5 mechanizm, który zmienia tylko stan i hasło."
verify = "Lokalnie: pusty schemat + dotnet run z FirstAdmin w appsettings.Local.json tworzy Konto Administratora z obiema rolami, drugi start nic nie zmienia, a start bez Administratora i bez FirstAdmin kończy się komunikatem; po ustawieniu status=blocked w bazie zalogowany User traci dostęp przy następnym żądaniu HTTP albo najpóźniej po minucie i trafia na logowanie, a wyjątki CurrentUser w obwodzie pokrywa test; po ustawieniu must_change_password każda strona prowadzi na /konto/zmiana-hasla, a zasoby statyczne nadal się ładują; dobrowolna zmiana hasła nie wylogowuje (User zalogowany po 2 minutach)."
covers = ["R19", "R20", "R25"]
after = [3]
hitl = false
risk = "high" # stan Konta w obwodzie Blazor Server i walidacja ciasteczka to najsłabiej udokumentowana część Identity
references = ["architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-15", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-17", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-21", "architecture-rejestr-czasu/architecture-rejestr-czasu.md#ad-13"]
notes = ["Dodatkowe sprawdzenie: test, że zmiana security stamp innego Usera nie wylogowuje bieżącego."]

[[entry]]
id = 5
type = "story"
title = "Obraz aplikacji gotowy do pracy za proxy"
description = "Dockerfile z mcr.microsoft.com/dotnet/aspnet:10.0 (ICU i tzdata, ASPNETCORE_HTTP_PORTS=8080); aplikacja czyta tag obrazu ze zmiennej APP_IMAGE_TAG. UseForwardedHeaders (XForwardedFor, XForwardedProto) jako pierwszy element potoku, przed middleware CSP z historii 1.1 i limiterem z historii 3, z zaufaną podsiecią z klucza konfiguracji ForwardedHeaders__KnownNetwork w KnownIPNetworks. Klucze Data Protection w tabeli data_protection_keys z historii 2 (PersistKeysToDbContext, stały SetApplicationName). /health z AddDbContextCheck, [AllowAnonymous], zwraca tag obrazu, dodany do wyjątków przekierowania wymuszonej zmiany hasła z historii 4. Daje historii 8 obraz do wdrożenia oraz umowę: zmienne APP_IMAGE_TAG i ForwardedHeaders__KnownNetwork."
