title = "Nowy schemat Initial z Identity i UserId"
description = "Usuwa migrację Initial z historii 1.1 i tworzy nową z całym schematem AD-7: tabele Identity z kluczami int i nazwami snake_case nadanymi jawnie, użytkownik z kolumnami status, registered_at, last_login_at, must_change_password, tabele account_settings i data_protection_keys, Project, WorkType i TimeEntry z user_id, indeksy (user_id, code) i (user_id, lower(name)), złożone klucze obce Wpisu ze Słownikami i klucze obce do users z RESTRICT. Wprowadza Data/IUserOwned, dwa tryby AppDbContext (Usera i systemowy) i Data/UserDbContextFactory przyjmującą UserId (źródło Usera, Accounts/CurrentUser, dokłada historia 3). Usuwa BackupOptions i ExportOptions oraz klucz Urls z appsettings.json (port lokalny w launchSettings.json). Daje historii 3 schemat i fabrykę kontekstu, historii 5 tabelę data_protection_keys, a epikom 1–3 i 5 oddzielenie danych."
